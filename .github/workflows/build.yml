name: Quetzalov (Windows + Android TV)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Windows projesini oluştur
        shell: pwsh
        run: |
          flutter create --project-name quetzalov --org com.quetzalov --platforms windows .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          python tools/patch_windows.py

      - name: Paketler ve ikon
        shell: pwsh
        run: |
          flutter pub get
          dart run flutter_launcher_icons -f tools/icons_windows.yaml

      - name: Kod kontrolü
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Uygulamayı derle
        run: flutter build windows --release

      - name: Kurulum dosyası oluştur
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" installer\quetzalov.iss

      - name: Taşınabilir sürüm (zip)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Quetzalov-Tasinabilir.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Quetzalov
          path: |
            Quetzalov-Kurulum.exe
            Quetzalov-Tasinabilir.zip

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quetzalov v1.0.${{ github.run_number }}
          files: |
            Quetzalov-Kurulum.exe
            Quetzalov-Tasinabilir.zip

  android-tv:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Android projesini oluştur
        run: |
          flutter create --project-name quetzalov --org com.quetzalov --platforms android .
          rm -rf test
          python3 tools/patch_android.py
          mkdir -p ~/.android
          if [ -f android_keystore/debug.keystore ]; then cp android_keystore/debug.keystore ~/.android/debug.keystore; fi

      - name: Paketler ve ikon
        run: |
          flutter pub get
          dart run flutter_launcher_icons -f tools/icons_android.yaml

      - name: APK derle
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk Quetzalov-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quetzalov-TV
          path: Quetzalov-TV.apk

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quetzalov v1.0.${{ github.run_number }}
          files: Quetzalov-TV.apk
