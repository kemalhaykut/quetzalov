<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a160d"/>
      <stop offset="0.55" stop-color="#14090c"/>
      <stop offset="1" stop-color="#0b0b10"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c81d25"/>
      <stop offset="0.45" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#ffd25a"/>
    </linearGradient>
    <linearGradient id="fire2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d1f"/>
      <stop offset="1" stop-color="#fff0a8"/>
