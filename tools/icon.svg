    <path transform="translate(1024,0) scale(-1,1)" d="M505 470 C 450 430, 400 390, 360 330 C 410 360, 450 370, 480 372 C 450 330, 430 290, 425 240 C 465 300, 495 340, 512 380 Z"/>
  </g>
  <!-- gövde -->
  <path d="M512 300 C 560 330, 575 400, 560 480 C 548 545, 530 600, 512 650 C 494 600, 476 545, 464 480 C 449 400, 464 330, 512 300 Z" fill="url(#fire)"/>
